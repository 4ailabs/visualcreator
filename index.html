<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizaciones Guiadas Mentales</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧘‍♀️ Visualizaciones Guiadas Mentales</h1>
            <p class="subtitle">Explora prácticas de meditación y visualización para tu bienestar mental y espiritual</p>
        </header>

        <nav class="view-selector">
            <button class="tab-btn active" data-view="daily">Vista Diaria</button>
            <button class="tab-btn" data-view="stages">Vista por Etapas</button>
        </nav>

        <!-- Vista Diaria -->
        <section id="daily-view" class="view-container active">
            <div class="days-navigation">
                <button class="day-btn" data-day="lunes">Lunes</button>
                <button class="day-btn" data-day="martes">Martes</button>
                <button class="day-btn" data-day="miercoles">Miércoles</button>
                <button class="day-btn" data-day="jueves">Jueves</button>
                <button class="day-btn" data-day="viernes">Viernes</button>
                <button class="day-btn" data-day="sabado">Sábado</button>
                <button class="day-btn" data-day="domingo">Domingo</button>
            </div>
            <div class="daily-content">
                <h2 id="current-day-title">Selecciona un día</h2>
                <div id="exercises-container" class="visualizations-grid"></div>
            </div>
        </section>

        <!-- Vista por Etapas -->
        <section id="stages-view" class="view-container">
            <div class="stages-navigation">
                <button class="stage-btn" data-stage="fase1">Fase 1: Despertar</button>
                <button class="stage-btn" data-stage="fase2">Fase 2: Profundización</button>
                <button class="stage-btn" data-stage="fase3">Fase 3: Maestría</button>
                <button class="stage-btn" data-stage="fase4">Fase 4: Expansión</button>
            </div>
            <div class="stages-content">
                <h2 id="current-stage-title">Selecciona una fase</h2>
                <div class="stage-info">
                    <p id="stage-description"></p>
                    <p id="stage-duration"></p>
                </div>
                <div id="stage-exercises-container" class="visualizations-grid"></div>
            </div>
        </section>

        <!-- Panel de Estadísticas -->
        <aside class="stats-panel">
            <h3>Resumen de Práctica</h3>
            <div class="stat-item">
                <span class="stat-label">Total de visualizaciones:</span>
                <span class="stat-value" id="total-exercises">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Duración total:</span>
                <span class="stat-value" id="total-duration">0 min</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Nivel de práctica:</span>
                <span class="stat-value" id="practice-level">Principiante</span>
            </div>
        </aside>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
